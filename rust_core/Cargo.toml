[package]
name = "keylesspass_core"
version = "0.1.0"
description = "KeylessPass storage-free local password derivation core"
edition = "2021"
rust-version = "1.70"

[lib]
name = "keylesspass_core"
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
aes-gcm = "0.10"
argon2 = "0.5"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
ed25519-dalek = "2"
getrandom = "0.2"
hkdf = "0.12"
hmac = "0.12"
pbkdf2 = "0.12"
rand = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
scrypt = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
unicode-normalization = "0.1"
uuid = { version = "1", features = ["serde", "v4"] }
zeroize = { version = "1", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security_Cryptography",
  "Win32_System_Memory"
] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
