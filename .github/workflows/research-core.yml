name: Research core verification

on:
  push:
    paths:
      - "rust_core/**"
      - ".github/workflows/research-core.yml"
  pull_request:
    paths:
      - "rust_core/**"
      - ".github/workflows/research-core.yml"
  workflow_dispatch:

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: rust_core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust_core
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-targets
      - name: Run reproducible quick experiment
        shell: bash
        run: cargo run --release --example research_evaluation -- ../experiments/results/ci-${{ runner.os }}
      - uses: actions/upload-artifact@v4
        with:
          name: research-results-${{ runner.os }}
          path: experiments/results/ci-${{ runner.os }}
          if-no-files-found: error
